<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP+ · Conversor de Horas em Centésimos</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:14px;
    transition:background .25s ease,color .25s ease;
  }

  /* ===== Tokens padrão DP+ (idênticos ao index.html) ===== */
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --surface2:#f9fafb;
    --border:#e5e7eb; --border2:#e5e7eb;
    --accent:#0d7377; --accent-d:#0a5d61; --accent-bg:#e6f4f4;
    --text:#111827; --muted:#6b7280; --muted2:#9ca3af;
    --green:#16a34a; --green-bg:#dcfce7;
    --red:#dc2626; --red-bg:#fee2e2;
    --amber:#d97706; --amber-bg:#fef3c7;
    --radius:8px; --radius-lg:12px;
    --shadow:0 1px 2px rgba(0,0,0,.04);
  }

  body{background:var(--bg);color:var(--text)}

  /* ===== Header — idêntico ao <header> do index.html (var(--navy), 52px) ===== */
  header{
    background:#111827; color:#ffffff;
    height:52px; padding:0 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100;
  }
  .hd-l{display:flex;align-items:center;gap:14px}
  .hd-logo{font-size:17px;font-weight:800;letter-spacing:-.5px}
  .hd-logo span{color:#22d3ee}
  .hd-crumb{font-size:12px;padding:3px 10px;background:rgba(255,255,255,.08);border-radius:20px;color:rgba(255,255,255,.65)}
  .hd-crumb b{color:#ffffff;font-weight:600}
  .hd-r{display:flex;align-items:center;gap:10px}
  .back-link{
    font-size:12px;color:rgba(255,255,255,.65);text-decoration:none;font-weight:600;
    padding:5px 12px;border-radius:6px;background:rgba(255,255,255,.1);
    transition:background .15s;
  }
  .back-link:hover{background:rgba(255,255,255,.18);color:#ffffff}

  /* ===== Container central ===== */
  .page{max-width:640px;margin:0 auto;padding:32px 20px 60px}
  .page-header{margin-bottom:20px}
  .page-header h1{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .page-header p{font-size:12.5px;color:var(--muted);margin-top:4px}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);
  }

  .drop-zone{
    border:1.5px dashed var(--border2);border-radius:var(--radius-lg);
    padding:2.2rem 1.5rem;text-align:center;cursor:pointer;
    background:var(--surface2);transition:border-color .15s,background .15s;
  }
  .drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-bg)}
  .drop-icon{font-size:26px;margin-bottom:10px;display:block}
  .drop-zone h3{font-size:14px;font-weight:600;margin-bottom:4px}
  .drop-zone small{font-size:12px;color:var(--muted)}
  #file-input{display:none}

  .section{margin-top:18px}
  .section-label{
    font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:8px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--border)}

  .col-grid{display:flex;flex-direction:column;gap:5px}
  .col-row{
    display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  }
  .col-name{font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
  .col-tag{
    font-size:11px;padding:3px 9px;border-radius:999px;
    background:var(--accent-bg);color:var(--accent-d);border:1px solid var(--accent);font-weight:600;
  }

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
  .stat-n{font-size:20px;font-weight:700;color:var(--accent);line-height:1}
  .stat-l{font-size:10px;color:var(--muted);letter-spacing:.05em;margin-top:4px;font-weight:600;text-transform:uppercase}

  .log-box{
    background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 14px;max-height:110px;overflow-y:auto;font-size:12px;line-height:1.8;font-family:ui-monospace,monospace;
  }
  .l-ok{color:var(--green)} .l-err{color:var(--red)} .l-info{color:var(--muted)} .l-prefix{color:var(--muted2)}

  .actions{display:flex;gap:8px;margin-top:18px}
  .btn{
    padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;
    border:1.5px solid transparent;transition:all .15s;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--accent-d)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--border2)}
  .btn-ghost:hover{background:var(--surface2);color:var(--text)}
  .hidden{display:none!important}

  .note{
    max-width:640px;margin:0 auto 8px;padding:12px 20px;font-size:12px;color:var(--muted);
  }
</style>
</head>
<body>

  <header>
    <div class="hd-l">
      <div class="hd-logo">DP<span>+</span></div>
      <div class="hd-crumb">Ferramentas / <b>Conversor de Horas em Centésimos</b></div>
    </div>
    <div class="hd-r">
      <a class="back-link" href="ferramentas.html">← Voltar às Ferramentas</a>
    </div>
  </header>

  <div class="page">
    <div class="page-header">
      <h1>Conversor de Horas em Centésimos</h1>
      <p>Converte colunas de horas (H:MM) para formato centesimal (H,MM) em planilhas .xlsx</p>
    </div>

    <div class="card">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <span class="drop-icon">📄</span>
        <h3>Arraste o arquivo aqui</h3>
        <small>.xlsx — solte ou clique para selecionar</small>
      </div>
      <input type="file" id="file-input" accept=".xlsx">

      <div id="cols-section" class="section hidden">
        <div class="section-label">colunas detectadas</div>
        <div class="col-grid" id="col-list"></div>
        <div class="stats-row" id="stats"></div>
      </div>

      <div id="log-section" class="section hidden">
        <div class="section-label">log</div>
        <div class="log-box" id="log"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-convert" disabled onclick="converter()">⬇ Converter e baixar</button>
        <button class="btn btn-ghost hidden" id="btn-clear" onclick="limpar()">✕ Limpar</button>
      </div>
    </div>
  </div>

<script>
let wbGlobal=null,fileNameGlobal='',timeCols=[],headerRow=0;
const dropZone=document.getElementById('drop-zone');
const fileInput=document.getElementById('file-input');

dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('drag')});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('drag'));
dropZone.addEventListener('drop',e=>{e.preventDefault();dropZone.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)processFile(f)});
fileInput.addEventListener('change',e=>{if(e.target.files[0])processFile(e.target.files[0])});

function log(msg,type='info'){
  const el=document.getElementById('log');
  const d=document.createElement('div');
  const prefix=type==='ok'?'✓ ':type==='err'?'✗ ':'› ';
  d.innerHTML=`<span class="l-prefix">${prefix}</span><span class="l-${type==='ok'?'ok':type==='err'?'err':'info'}">${msg}</span>`;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
  document.getElementById('log-section').classList.remove('hidden');
}

function isTimeStr(v){return typeof v==='string'&&/^\d{1,3}:\d{2}(:\d{2})?$/.test(v.trim())}
function isTimeNum(v){if(typeof v!=='number')return false;const f=v%1;return f>0&&f<1&&v<10}
function isTimeDays(v){return typeof v==='string'&&/^\d+ day/.test(v)}

function convertVal(v){
  if(v===null||v===undefined||v==='')return null;
  if(isTimeStr(v)){const p=v.trim().split(':');return `${parseInt(p[0])},${p[1]}`}
  if(isTimeNum(v)){const t=Math.round(v*24*60);const h=Math.floor(t/60);const m=t%60;return `${h},${String(m).padStart(2,'0')}`}
  if(isTimeDays(v)){const m=v.match(/(\d+) days?,\s*(\d+):(\d+)/);if(m){const h=parseInt(m[1])*24+parseInt(m[2]);return `${h},${m[3]}`}}
  return null;
}

function processFile(file){
  fileNameGlobal=file.name;
  log(`${file.name}`);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      wbGlobal=XLSX.read(data,{type:'array',cellDates:false,cellStyles:true});
      const ws=wbGlobal.Sheets[wbGlobal.SheetNames[0]];
      const ref=XLSX.utils.decode_range(ws['!ref']||'A1');
      headerRow=ref.s.r;
      for(let r=ref.s.r;r<=Math.min(ref.s.r+15,ref.e.r);r++){
        let has=false;
        for(let c=ref.s.c;c<=ref.e.c;c++){const cell=ws[XLSX.utils.encode_cell({r,c})];if(cell&&typeof cell.v==='string'&&cell.v.replace(/^'/,'').trim().length>1){has=true;break}}
        if(has){headerRow=r;break}
      }
      const colSet=new Set();
      for(let r=headerRow+1;r<=ref.e.r;r++){
        for(let c=ref.s.c;c<=ref.e.c;c++){
          const cell=ws[XLSX.utils.encode_cell({r,c})];
          if(!cell)continue;
          if(isTimeStr(cell.v)||isTimeNum(cell.v)||isTimeDays(cell.v))colSet.add(c);
        }
      }
      timeCols=Array.from(colSet).sort((a,b)=>a-b);
      if(timeCols.length===0){log('Nenhuma coluna de hora encontrada.','err');return}
      const colList=document.getElementById('col-list');colList.innerHTML='';
      let totalVals=0;
      timeCols.forEach(c=>{
        const hc=ws[XLSX.utils.encode_cell({r:headerRow,c})];
        const nome=hc?String(hc.v).replace(/^'/,'').trim():`Col ${XLSX.utils.encode_col(c)}`;
        let count=0;
        for(let r=headerRow+1;r<=ref.e.r;r++){const cell=ws[XLSX.utils.encode_cell({r,c})];if(cell&&(isTimeStr(cell.v)||isTimeNum(cell.v)||isTimeDays(cell.v)))count++}
        totalVals+=count;
        const d=document.createElement('div');d.className='col-row';
        d.innerHTML=`<span class="col-name">${XLSX.utils.encode_col(c)} — ${nome}</span><span class="col-tag">${count} valores</span>`;
        colList.appendChild(d);
      });
      document.getElementById('stats').innerHTML=`
        <div class="stat"><div class="stat-n">${timeCols.length}</div><div class="stat-l">Colunas</div></div>
        <div class="stat"><div class="stat-n">${totalVals}</div><div class="stat-l">Valores</div></div>
        <div class="stat"><div class="stat-n">${ref.e.r-headerRow}</div><div class="stat-l">Linhas</div></div>`;
      document.getElementById('cols-section').classList.remove('hidden');
      document.getElementById('btn-convert').disabled=false;
      document.getElementById('btn-clear').classList.remove('hidden');
      log(`${timeCols.length} coluna(s) detectada(s). Pronto.`,'ok');
    }catch(err){log('Erro: '+err.message,'err')}
  };
  reader.readAsArrayBuffer(file);
}

function converter(){
  if(!wbGlobal)return;
  try{
    const wsName=wbGlobal.SheetNames[0];
    const ws=JSON.parse(JSON.stringify(wbGlobal.Sheets[wsName]));
    const ref=XLSX.utils.decode_range(ws['!ref']);
    const colsSorted=[...timeCols].sort((a,b)=>b-a);
    let converted=0;
    colsSorted.forEach(origC=>{
      for(let r=ref.s.r;r<=ref.e.r;r++){
        for(let c=ref.e.c;c>origC;c--){
          const from=XLSX.utils.encode_cell({r,c});
          const to=XLSX.utils.encode_cell({r,c:c+1});
          if(ws[from]){ws[to]=ws[from];delete ws[from];}else{delete ws[to];}
        }
      }
      const newC=origC+1;
      const hCell=ws[XLSX.utils.encode_cell({r:headerRow,c:origC})];
      const newHeader={v:((hCell?String(hCell.v).replace(/^'/,'').trim():'')+' (conv.)'),t:'s'};
      if(hCell&&hCell.s) newHeader.s=JSON.parse(JSON.stringify(hCell.s));
      ws[XLSX.utils.encode_cell({r:headerRow,c:newC})]=newHeader;
      for(let r=headerRow+1;r<=ref.e.r;r++){
        const cell=ws[XLSX.utils.encode_cell({r,c:origC})];
        if(!cell)continue;
        const conv=convertVal(cell.v);
        if(conv!==null){
          const newCell={v:conv,t:'s'};
          if(cell.s) newCell.s=JSON.parse(JSON.stringify(cell.s));
          ws[XLSX.utils.encode_cell({r,c:newC})]=newCell;
          converted++;
        }
      }
      if(ws['!cols']){
        const colsCopy=[...ws['!cols']];
        const refW=colsCopy[origC]?{...colsCopy[origC]}:{wch:12};
        colsCopy.splice(newC,0,refW);
        ws['!cols']=colsCopy;
      }
      if(ws['!merges']){
        ws['!merges']=ws['!merges'].map(m=>{
          const nm={s:{r:m.s.r,c:m.s.c},e:{r:m.e.r,c:m.e.c}};
          if(nm.s.c>origC) nm.s.c++;
          if(nm.e.c>origC) nm.e.c++;
          return nm;
        });
      }
      ref.e.c+=1;
    });
    ws['!ref']=XLSX.utils.encode_range(ref);
    const newWb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWb,ws,wsName);
    wbGlobal.SheetNames.forEach(sn=>{
      if(sn!==wsName) XLSX.utils.book_append_sheet(newWb,JSON.parse(JSON.stringify(wbGlobal.Sheets[sn])),sn);
    });
    const base=fileNameGlobal.replace(/\.xlsx$/i,'');
    XLSX.writeFile(newWb,base+'_convertida.xlsx',{bookType:'xlsx',cellStyles:true});
    log(`${converted} valores convertidos → ${base}_convertida.xlsx`,'ok');
  }catch(err){log('Erro ao converter: '+err.message,'err')}
}

function limpar(){
  wbGlobal=null;fileNameGlobal='';timeCols=[];
  document.getElementById('cols-section').classList.add('hidden');
  document.getElementById('log-section').classList.add('hidden');
  document.getElementById('log').innerHTML='';
  document.getElementById('btn-convert').disabled=true;
  document.getElementById('btn-clear').classList.add('hidden');
  document.getElementById('file-input').value='';
}
</script>
</body>
</html>
