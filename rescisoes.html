<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DP+ · Rescisões</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   DESIGN TOKENS — copiados literalmente do index.html para manter
   os dois módulos visualmente idênticos. Qualquer mudança de marca
   ou paleta precisa ser replicada manualmente nos dois arquivos
   (mesma limitação já documentada para auth-callback.html).
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html { height: 100% }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  background: #f3f4f6;
  color: #111827;
  min-height: 100vh;
}
:root {
  --teal:       #0d7377;
  --teal-d:     #0a5d61;
  --teal-bg:    #e6f4f4;
  --navy:       #111827;
  --gray-50:    #f9fafb;
  --gray-100:   #f3f4f6;
  --gray-200:   #e5e7eb;
  --gray-400:   #9ca3af;
  --gray-500:   #6b7280;
  --gray-700:   #374151;
  --green:      #16a34a;
  --green-bg:   #dcfce7;
  --red:        #dc2626;
  --red-bg:     #fee2e2;
  --amber:      #d97706;
  --amber-bg:   #fef3c7;
  --blue:       #2563eb;
  --blue-bg:    #dbeafe;
  --white:      #ffffff;
  --radius:     8px;
  --radius-lg:  12px;
}
.hidden { display: none !important }
label { display: block; font-size: 11px; font-weight: 600; color: var(--gray-500);
        text-transform: uppercase; letter-spacing:.05em; margin-bottom: 5px }
input[type=text], input[type=date], input[type=number], select, textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
  background: var(--white);
  font-family: inherit;
  transition: border-color .15s;
}
textarea { resize: vertical; min-height: 60px }
input:focus, select:focus, textarea:focus { border-color: var(--teal) }
.btn {
  padding: 9px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1.5px solid transparent; transition: all .15s;
}
.btn-primary  { background: var(--teal); color: var(--white); }
.btn-primary:hover { background: var(--teal-d) }
.btn-primary:disabled { opacity: .55; cursor: not-allowed }
.btn-secondary { background: var(--white); color: var(--gray-700); border-color: var(--gray-200) }
.btn-secondary:hover { background: var(--gray-50) }
.btn-danger { background: var(--red-bg); color: var(--red); border-color: #fca5a5 }
.btn-xs {
  padding:3px 9px; border-radius:5px; font-size:11px; font-weight:600;
  cursor:pointer; border:1.5px solid transparent; transition:all .12s;
}
.spinner {
  width: 18px; height: 18px; border: 2.5px solid var(--gray-200); border-top-color: var(--teal);
  border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg) } }
.loading { display:flex; align-items:center; justify-content:center;
           gap: 10px; padding: 60px 20px; color: var(--gray-400); font-size:13px }
.empty { text-align:center; padding:60px 20px; color:var(--gray-500) }
.empty h3 { font-size:16px; font-weight:600; color:var(--gray-700); margin-bottom:8px }
.empty p  { font-size:13px; line-height:1.6 }

/* === HEADER === */
header {
  background: var(--navy); color: var(--white); height: 52px; padding: 0 20px;
  display:flex; align-items:center; justify-content:space-between;
  position: sticky; top:0; z-index:100;
}
.hd-l { display:flex; align-items:center; gap:14px }
.hd-back { color:rgba(255,255,255,.7); text-decoration:none; font-size:13px; font-weight:500 }
.hd-back:hover { color:#fff }
.hd-logo { font-size:17px; font-weight:800; letter-spacing:-.5px }
.hd-logo span { color: #22d3ee }
.hd-title { font-size:13px; color:rgba(255,255,255,.6); font-weight:500 }
.hd-r { display:flex; align-items:center; gap:12px }
.hd-user { font-size:12px; color:rgba(255,255,255,.75) }
.btn-sair {
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.85);
  border-radius:var(--radius); padding:6px 12px; font-size:12px; cursor:pointer; transition:background .15s;
}
.btn-sair:hover { background:rgba(255,255,255,.2) }
.btn-manual {
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.85);
  border-radius:var(--radius); padding:6px 12px; font-size:12px; cursor:pointer; transition:background .15s;
  display:inline-flex; align-items:center; gap:5px;
}
.btn-manual:hover { background:rgba(255,255,255,.2) }

main { max-width: 1200px; margin: 0 auto; padding: 0 20px 20px }

/* === LAYOUT — coluna principal (filtros + lista) e coluna lateral
   (indicadores). A lateral só é usada por quem enxerga a carteira toda
   (admin/gestor); para analista o conteúdo ocupa a coluna inteira. === */
#v-content { display:flex; gap:24px; align-items:flex-start }
.col-main { flex:1; min-width:0 }
.col-side { width:272px; flex-shrink:0; position:sticky; top:68px; display:flex; flex-direction:column; gap:16px }
@media (max-width: 900px) {
  #v-content { flex-direction:column }
  .col-side { width:100%; position:static }
}

/* === CABEÇALHO FIXO — cards de status + filtros ficam grudados no
   topo (abaixo do header de 52px) ao rolar a lista. Fundo sólido igual
   ao da página (--gray-100) pra mascarar o conteúdo passando por baixo. === */
.col-main-sticky {
  position:sticky; top:52px; z-index:50; background:var(--gray-100); padding-top:20px;
}

/* === CARDS DE STATUS — mesmo padrão visual da aba "Visão Geral" do
   index.html (.kgrid/.kcard): grade de cards com rótulo pequeno em
   caixa alta e número grande, mesmo raio/borda/cor de fundo. Colunas
   fixas (5, não auto-fit) porque o conjunto de cards é sempre o mesmo
   — assim todos ficam com a mesma largura, independente do tamanho do
   rótulo (era o que fazia o último ficar maior que os demais). === */
.kgrid { display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; margin-bottom:14px }
.kcard {
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
  padding:14px 16px; cursor:pointer; transition:border-color .12s, box-shadow .12s;
}
.kcard:hover { border-color:var(--teal); box-shadow:0 2px 10px rgba(0,0,0,.05) }
.kcard.active { border-color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset }
.kl { font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px }
.kn { font-size:24px; font-weight:800; line-height:1 }
@media (max-width: 720px) {
  .kgrid { grid-template-columns:repeat(2, 1fr) }
}

/* === TOOLBAR === */
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-bottom:14px }
.fl { font-size:11px; color:var(--gray-400); font-weight:600 }
.rs-search { max-width: 200px }
.rs-search input { padding:7px 12px; font-size:12px }
.filtro-analista, .filtro-escopo {
  width:auto; min-width:130px; max-width:180px; padding:5px 10px; font-size:11.5px;
  border-radius:20px; border:1.5px solid var(--gray-200); color:var(--gray-700);
}
.fbtn-prazo-toggle {
  padding:5px 12px; border-radius:20px; font-size:11px; font-weight:600; cursor:pointer;
  border:1.5px solid var(--gray-200); background:var(--white); color:var(--gray-500); transition:all .12s;
  white-space:nowrap;
}
.fbtn-prazo-toggle:hover:not(.on) { border-color:var(--amber); color:var(--amber) }
.fbtn-prazo-toggle.on { background:var(--amber-bg); border-color:var(--amber); color:var(--amber) }

/* === PAINEL LATERAL — gráfico de rosca por analista === */
.donut-card {
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
  padding:16px; display:flex; flex-direction:column; gap:12px;
}
.donut-card h4 {
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500);
}
.donut-wrap { display:flex; flex-direction:column; align-items:center; gap:14px }
.donut-svg { flex-shrink:0 }
.donut-legend { width:100%; display:flex; flex-direction:column; gap:7px; font-size:11.5px }
.donut-legend-item { display:flex; align-items:center; gap:7px }
.donut-legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0 }
.donut-legend-name {
  flex:1; color:var(--gray-700); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.donut-legend-count { color:var(--gray-500); white-space:nowrap; flex-shrink:0 }

/* === VOLUME MENSAL — rescisões por mês (data do último dia trabalhado).
   Fica acima da lista, fora do cabeçalho fixo (não é filtro do dia a
   dia, é uma visão de tendência — não precisa ficar grudada na tela). === */
.volume-card {
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
  padding:16px 18px 14px; margin-bottom:14px;
}
.volume-head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px }
.volume-head h4 { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500) }
.volume-head h4 .hint { text-transform:none; letter-spacing:0; font-weight:500 }
.volume-total { font-size:11px; color:var(--gray-500) }
.volume-total b { color:var(--navy); font-size:13px }
.volume-periodo { display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:14px }
.volume-periodo input[type=month] {
  width:auto; padding:5px 9px; font-size:11.5px; border-radius:20px; border:1.5px solid var(--gray-200);
}
.volume-reset {
  padding:4px 11px; border-radius:20px; font-size:11px; font-weight:600; cursor:pointer;
  border:1.5px solid var(--gray-200); background:var(--white); color:var(--gray-500); transition:all .12s;
  white-space:nowrap;
}
.volume-reset:hover { border-color:var(--teal); color:var(--teal) }
.volume-chart { display:flex; align-items:flex-end; gap:6px; overflow-x:auto; padding-bottom:2px; min-height:130px }
.volume-bar-wrap { display:flex; flex-direction:column-reverse; align-items:center; gap:4px; min-width:34px; flex:1 }
.volume-bar { width:60%; min-width:14px; background:var(--teal); border-radius:4px 4px 0 0 }
.volume-bar.zero { background:var(--gray-200) }
.volume-bar-lbl { font-size:9.5px; color:var(--gray-400); white-space:nowrap }
.volume-bar-n { font-size:10.5px; font-weight:700; color:var(--navy) }

/* === LISTA === */
.rs-card.cancelada { opacity:.7; border-style:dashed }
.badge-cancelada { background:var(--red-bg); color:var(--red) }
.rs-card {
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
  padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .12s, box-shadow .12s;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.rs-card:hover { border-color:var(--teal); box-shadow:0 2px 10px rgba(0,0,0,.05) }
.rs-card.atrasada { border-left:3px solid var(--red) }
.rs-main { flex:1; min-width:220px }
.rs-nome { font-weight:700; font-size:13.5px; color:var(--navy) }
.rs-sub { font-size:11.5px; color:var(--gray-500); margin-top:2px }
.rs-meta { display:flex; gap:18px; align-items:center; flex-wrap:wrap }
.rs-meta-item { font-size:11px; color:var(--gray-500) }
.rs-meta-item b { color:var(--gray-700); font-weight:600 }
.rs-prazo.atrasada { color:var(--red); font-weight:700 }

/* === STATUS BADGE === */
.badge {
  font-size:11px; font-weight:700; padding:3px 11px; border-radius:12px; white-space:nowrap;
}
.st-solicitada         { background:var(--gray-100); color:var(--gray-500) }
.st-em_calculo         { background:var(--amber-bg); color:var(--amber) }
.st-em_conferencia     { background:var(--blue-bg);  color:var(--blue) }
.st-aguardando_cliente { background:var(--red-bg);   color:var(--red) }
.st-aprovada           { background:var(--teal-bg);  color:var(--teal) }
.st-guias_emitidas     { background:var(--blue-bg);  color:var(--blue) }
.st-finalizada         { background:var(--green-bg); color:var(--green) }

/* === MODAL === */
.overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200;
  align-items:flex-start; justify-content:center; overflow-y:auto; padding:32px 16px;
}
.overlay.show { display:flex }
.modal {
  background:var(--white); border-radius:var(--radius-lg); padding:24px; width:100%;
  max-width:480px; box-shadow:0 8px 40px rgba(0,0,0,.2);
}
.modal.wide { max-width: 640px }
.modal h3 { font-size:16px; font-weight:700; margin-bottom:3px }
.modal > p.sub { font-size:12px; color:var(--gray-500); margin-bottom:18px }
.field { margin-bottom:14px }
.frow2 { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.mactions { display:flex; gap:8px; margin-top:18px }
.hint { font-size:11px; color:var(--gray-400); margin-top:4px; line-height:1.4 }
.emp-found { font-size:12px; color:var(--teal); font-weight:600; margin-top:6px }
.emp-err   { font-size:12px; color:var(--red);  font-weight:600; margin-top:6px }
.close-x {
  position:absolute; top:16px; right:16px; background:none; border:none; cursor:pointer;
  font-size:18px; color:var(--gray-400); line-height:1;
}
.close-x:hover { color:var(--gray-700) }
.modal { position:relative }

/* === DETALHE === */
.det-section { margin-top:20px; padding-top:16px; border-top:1px solid var(--gray-200) }
.det-section h4 { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
                   color:var(--gray-500); margin-bottom:10px }
.pipeline-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.check-item {
  display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--gray-100);
}
.check-item:last-child { border-bottom:none }
.check-item input[type=checkbox] { margin-top:2px; width:16px; height:16px; accent-color:var(--teal); cursor:pointer }
.check-body { flex:1 }
.check-label { font-size:13px; font-weight:600; color:var(--navy) }
.check-label.done { text-decoration:line-through; color:var(--gray-400); font-weight:500 }
.check-meta { font-size:11px; color:var(--gray-400); margin-top:2px }
.timeline-item { padding:8px 0 8px 16px; border-left:2px solid var(--gray-200); position:relative; margin-left:4px }
.timeline-item::before {
  content:''; position:absolute; left:-5px; top:12px; width:8px; height:8px;
  border-radius:50%; background:var(--teal);
}
.timeline-item:last-child { border-left-color:transparent }
.tl-status { font-size:12px; font-weight:700; color:var(--navy) }
.tl-meta { font-size:11px; color:var(--gray-400); margin-top:1px }
.tl-obs { font-size:11.5px; color:var(--gray-500); margin-top:3px; font-style:italic }
.cancel-banner {
  background:var(--red-bg); color:var(--red); border-radius:var(--radius); padding:12px 14px;
  font-size:12.5px; margin-bottom:16px; line-height:1.5;
}
.cancel-banner b { display:block; font-size:13px; margin-bottom:2px }
.status-changer { display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px }
.status-changer select { width:auto; min-width:180px }
.danger-zone { margin-top:20px; padding-top:16px; border-top:1px dashed var(--red-bg) }

/* === TOAST === */
#toast {
  position:fixed; bottom:20px; right:20px; z-index:300; padding:12px 18px; border-radius:var(--radius);
  font-size:13px; font-weight:500; box-shadow:0 4px 16px rgba(0,0,0,.18);
}
#toast.ok  { background:var(--green); color:#fff }
#toast.err { background:var(--red); color:#fff }
#toast.inf { background:var(--navy); color:#fff }
</style>
</head>
<body>

<header>
  <div class="hd-l">
    <a href="/" class="hd-back">← DP+</a>
    <div class="hd-logo" id="hd-logo-text">DP<span>+</span></div>
    <div class="hd-title">Rescisões</div>
  </div>
  <div class="hd-r">
    <span class="hd-user" id="hd-user"></span>
    <button class="btn-manual" onclick="window.open('/manual_rescisoes_dp+.html','_blank')" title="Abrir manual do módulo de Rescisões">📖 Manual</button>
    <button class="btn-sair" onclick="doLogout()">Sair</button>
  </div>
</header>

<main>
  <div id="v-loading" class="loading"><div class="spinner"></div> Carregando…</div>

  <div id="v-content" class="hidden">
    <div class="col-main">
      <div class="col-main-sticky">
        <div class="kgrid" id="kpi-sumbar"></div>

        <div class="toolbar">
          <select class="filtro-escopo" id="filtro-escopo" onchange="setEscopo(this.value)">
            <option value="ativas">Ativas</option>
            <option value="canceladas">Canceladas</option>
            <option value="finalizadas">Finalizadas</option>
            <option value="todas">Todas</option>
          </select>
          <select class="filtro-analista hidden" id="filtro-analista" onchange="setFiltroAnalista(this.value)"></select>
          <button class="fbtn-prazo-toggle" id="btn-toggle-prazo5d" onclick="togglePrazo5d()" title="Rescisões não finalizadas com prazo de pagamento nos próximos 5 dias">📅 Vencendo em 5 dias</button>
          <div class="rs-search">
            <input type="text" id="busca" placeholder="Buscar funcionário ou empresa…" oninput="renderLista()">
          </div>
          <button class="btn btn-primary" onclick="openCadastro()">+ Nova rescisão</button>
        </div>
      </div>

      <div class="volume-card hidden" id="volume-card">
        <div class="volume-head">
          <h4>Rescisões por mês <span class="hint">— data do último dia trabalhado</span></h4>
          <span class="volume-total" id="volume-total"></span>
        </div>
        <div class="volume-periodo">
          <span class="fl">Período:</span>
          <input type="month" id="volume-mes-inicio" onchange="setPeriodoVolume('inicio', this.value)">
          <span class="fl">até</span>
          <input type="month" id="volume-mes-fim" onchange="setPeriodoVolume('fim', this.value)">
          <button class="volume-reset" onclick="resetPeriodoVolume()">Últimos 12 meses</button>
        </div>
        <div class="volume-chart" id="volume-chart"></div>
      </div>

      <div id="lista"></div>
    </div>

    <aside class="col-side hidden" id="col-side">
      <div class="donut-card" id="donut-card"></div>
    </aside>
  </div>
</main>

<!-- ============================================================
     MODAL — Nova rescisão
     ============================================================ -->
<div class="overlay" id="modal-cad">
  <div class="modal wide">
    <button class="close-x" onclick="closeCadastro()">✕</button>
    <h3>Nova rescisão</h3>
    <p class="sub">Preencha os dados para abrir o processo e gerar o checklist.</p>

    <div class="field">
      <label>Empresa (código)</label>
      <input type="text" id="cad-empresa-codigo" placeholder="Digite o código da empresa"
             oninput="onEmpresaCodigoInput()">
      <div id="cad-empresa-status"></div>
    </div>

    <div class="field" id="cad-responsavel-wrap">
      <label>Responsável</label>
      <select id="cad-analista"></select>
    </div>

    <div class="field">
      <label>Nome do funcionário</label>
      <input type="text" id="cad-nome" oninput="toUpper(this)">
    </div>

    <div class="frow2">
      <div class="field">
        <label>Tipo de rescisão</label>
        <select id="cad-tipo-rescisao"></select>
      </div>
      <div class="field">
        <label>Aviso prévio</label>
        <select id="cad-tipo-aviso"></select>
      </div>
    </div>

    <div class="frow2">
      <div class="field">
        <label>Data da rescisão (último dia trabalhado)</label>
        <input type="date" id="cad-data-rescisao">
      </div>
      <div class="field">
        <label>Data da solicitação</label>
        <input type="date" id="cad-data-solicitacao">
      </div>
    </div>

    <div class="field">
      <label>Data de recebimento dos apontamentos</label>
      <input type="date" id="cad-data-recebimento">
      <div class="hint">Data em que o escritório recebeu a documentação do cliente — deixe em branco se ainda não recebeu.</div>
    </div>

    <div class="field">
      <label>Observações</label>
      <textarea id="cad-obs" oninput="toUpper(this)"></textarea>
    </div>

    <div class="mactions">
      <button class="btn btn-secondary" onclick="closeCadastro()">Cancelar</button>
      <button class="btn btn-primary" id="cad-btn-salvar" onclick="submitCadastro()">Abrir rescisão</button>
    </div>
  </div>
</div>

<!-- ============================================================
     MODAL — Detalhe da rescisão
     ============================================================ -->
<div class="overlay" id="modal-det">
  <div class="modal wide">
    <button class="close-x" onclick="closeDetalhe()">✕</button>
    <div id="det-body"></div>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
// ============================================================
// CONFIG — mesmo projeto Supabase do index.html
// ============================================================
const SUPA_URL = 'https://app.dpmaisconsultoria.com.br/supa';

// Status que compõem o pipeline ativo — usados na barra de indicadores

// Paleta cíclica do gráfico de rosca por analista — cores fixas, não
// derivadas do quadro de cores do design system porque aqui a função é
// diferenciar N analistas, não comunicar semântica de status/risco.
const DONUT_COLORS = ['#0d7377','#2563eb','#d97706','#dc2626','#16a34a','#7c3aed','#db2777','#0891b2','#65a30d','#ea580c'];

// Volume mensal — período exibido no gráfico "Rescisões por mês"
// (formato 'YYYY-MM', mesmo formato do <input type=month>). Calculado
// como janela móvel dos últimos 12 meses (incluindo o mês atual) toda
// vez que a página carrega ou que o botão de reset é usado.
let MES_INICIO = null, MES_FIM = null;
function calcularPeriodoPadrao12m() {
  const hoje = new Date();
  const fim = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const inicio = new Date(hoje.getFullYear(), hoje.getMonth() - 11, 1);
  MES_FIM = fim.toISOString().slice(0, 7);
  MES_INICIO = inicio.toISOString().slice(0, 7);
}
calcularPeriodoPadrao12m();

// ============================================================
// KPI PANEL — cards por status do pipeline ativo + gráfico de rosca
// por analista. Recalculados a cada renderLista(), então acompanham
// automaticamente qualquer mudança de dado ou filtro de analista.
// ============================================================

// Cards de status: sempre excluem canceladas e finalizadas (não fazem
// parte do pipeline "em aberto"), independente dos toggles de
// visibilidade da lista — os cards mostram o panorama do trabalho
// pendente, não o resultado filtrado da lista abaixo. Respeitam o
// filtro de analista (F_ANALISTA) quando admin/gestor tiver um
// selecionado; sem seleção, mostram o total do departamento/carteira.
function computeKpiCounts() {
  const counts = Object.fromEntries(STATUS_ATIVOS.map(s => [s, 0]));
  RESCISOES.forEach(r => {
    if (r.cancelada) return;
    if (!(r.status in counts)) return;
    if ((PERFIL === 'admin' || PERFIL === 'gestor') && F_ANALISTA !== 'todos' && r.analista_id !== F_ANALISTA) return;
    counts[r.status]++;
  });
  return counts;
}

// Mesmo padrão visual dos cards da aba "Visão Geral" do index.html
// (.kgrid/.kcard/.kl/.kn) — grade de cards com largura igual entre si,
// cada um clicável e funcionando como filtro de etapa.
function renderKpiSumbar() {
  const counts = computeKpiCounts();
  const cores = {
    solicitada: 'var(--gray-500)', em_calculo: 'var(--amber)', em_conferencia: 'var(--blue)',
    aguardando_cliente: 'var(--red)', aprovada: 'var(--teal)'
  };
  eid('kpi-sumbar').innerHTML = STATUS_ATIVOS.map(s => `
    <div class="kcard ${F_STATUS === s ? 'active' : ''}" onclick="setFiltro('${s}')" title="Filtrar por ${STATUS_LABEL[s]}">
      <div class="kl">${STATUS_LABEL[s]}</div>
      <div class="kn" style="color:${cores[s]}">${counts[s]}</div>
    </div>
  `).join('');
}

// Gráfico de rosca: processos ativos (não cancelados, não finalizados)
// agrupados por analista responsável, ordenados do maior para o menor
// volume — resposta direta a "quem tem mais processo pra fechar".
// Ignora F_ANALISTA de propósito: é um gráfico comparativo entre
// analistas, então sempre mostra o departamento inteiro. Só é chamado
// para admin/gestor (ver boot() e show('donut-card')).
function computeAnalistaBreakdown() {
  const map = {};
  RESCISOES.forEach(r => {
    if (r.cancelada || r.status === 'finalizada') return;
    const nome = r.usuarios?.nome || 'Sem responsável';
    map[nome] = (map[nome] || 0) + 1;
  });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}

function renderDonutAnalista() {
  if (eid('col-side').classList.contains('hidden')) return; // não construído para analista
  const el = eid('donut-card');

  const data = computeAnalistaBreakdown();
  const total = data.reduce((s, [, c]) => s + c, 0);

  if (!total) {
    el.innerHTML = `<h4>Processos ativos por analista</h4><p class="hint">Nenhum processo ativo no momento.</p>`;
    return;
  }

  const R = 52, C = 2 * Math.PI * R, CX = 70, CY = 70;
  let offset = 0;
  const arcos = data.map(([, count], i) => {
    const len = (count / total) * C;
    const cor = DONUT_COLORS[i % DONUT_COLORS.length];
    const arco = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${cor}"
      stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}"
      transform="rotate(-90 ${CX} ${CY})"/>`;
    offset += len;
    return arco;
  }).join('');

  const legenda = data.map(([nome, count], i) => `
    <div class="donut-legend-item">
      <span class="donut-legend-dot" style="background:${DONUT_COLORS[i % DONUT_COLORS.length]}"></span>
      <span class="donut-legend-name">${escHtml(nome)}</span>
      <span class="donut-legend-count">${count} · ${Math.round((count / total) * 100)}%</span>
    </div>`).join('');

  el.innerHTML = `
    <h4>Processos ativos por analista</h4>
    <div class="donut-wrap">
      <svg class="donut-svg" width="140" height="140" viewBox="0 0 140 140">
        ${arcos}
        <text x="70" y="66" text-anchor="middle" font-size="20" font-weight="800" fill="var(--navy)">${total}</text>
        <text x="70" y="82" text-anchor="middle" font-size="9" fill="var(--gray-500)">ATIVOS</text>
      </svg>
      <div class="donut-legend">${legenda}</div>
    </div>`;
}

// ============================================================
// VOLUME MENSAL — rescisões por mês, pela data do último dia
// trabalhado (data_rescisao), não pela data de pagamento. Cancelada
// não conta: representa um desligamento que não chegou a se
// consolidar (interrompido por um fato real), então entraria como
// "tivemos uma rescisão" de forma enganosa. Ignora F_ANALISTA/ESCOPO/
// F_STATUS de propósito — é uma pergunta de volume histórico total,
// não uma subview filtrada da lista (mesmo raciocínio do donut).
// ============================================================

// Gera a sequência de meses ('YYYY-MM') entre início e fim, inclusive.
// Retorna [] se início vier depois do fim (período inválido).
function monthRange(inicio, fim) {
  const [yi, mi] = inicio.split('-').map(Number);
  const [yf, mf] = fim.split('-').map(Number);
  const out = [];
  let y = yi, m = mi, guard = 0; // guard evita loop infinito com datas malformadas
  while ((y < yf || (y === yf && m <= mf)) && guard < 240) {
    out.push(`${y}-${String(m).padStart(2, '0')}`);
    m++; if (m > 12) { m = 1; y++; }
    guard++;
  }
  return out;
}

function computeVolumeMensal() {
  const meses = monthRange(MES_INICIO, MES_FIM);
  const counts = Object.fromEntries(meses.map(m => [m, 0]));
  RESCISOES.forEach(r => {
    if (r.cancelada || !r.data_rescisao) return;
    const m = r.data_rescisao.slice(0, 7);
    if (m in counts) counts[m]++;
  });
  return meses.map(m => ({ mes: m, total: counts[m] }));
}

const MES_ABREV = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtMesAno(m) {
  const [y, mm] = m.split('-');
  return `${MES_ABREV[parseInt(mm, 10) - 1]}/${y.slice(2)}`;
}

function renderVolumeMensal() {
  if (eid('volume-card').classList.contains('hidden')) return; // não construído para analista

  const dados = computeVolumeMensal();
  eid('volume-total').textContent = '';

  if (!dados.length) {
    eid('volume-chart').innerHTML = `<p class="hint">Período inválido — o mês inicial precisa ser igual ou anterior ao mês final.</p>`;
    return;
  }

  const totalPeriodo = dados.reduce((s, d) => s + d.total, 0);
  eid('volume-total').innerHTML = `<b>${totalPeriodo}</b> rescisão(ões) no período`;

  const maxVal = Math.max(1, ...dados.map(d => d.total));
  const CHART_MAX_PX = 90;

  eid('volume-chart').innerHTML = dados.map(d => {
    const px = d.total > 0 ? Math.max(4, Math.round((d.total / maxVal) * CHART_MAX_PX)) : 2;
    return `
      <div class="volume-bar-wrap" title="${fmtMesAno(d.mes)}: ${d.total} rescisão(ões)">
        <div class="volume-bar-lbl">${fmtMesAno(d.mes)}</div>
        <div class="volume-bar ${d.total === 0 ? 'zero' : ''}" style="height:${px}px"></div>
        <div class="volume-bar-n">${d.total || ''}</div>
      </div>`;
  }).join('');
}

function setPeriodoVolume(campo, v) {
  if (!v) return; // usuário limpou o campo — ignora, mantém valor anterior
  if (campo === 'inicio') MES_INICIO = v; else MES_FIM = v;
  renderVolumeMensal();
}

function resetPeriodoVolume() {
  calcularPeriodoPadrao12m();
  eid('volume-mes-inicio').value = MES_INICIO;
  eid('volume-mes-fim').value = MES_FIM;
  renderVolumeMensal();
}

function renderLista() {
  renderKpiSumbar();
  renderDonutAnalista();
  const busca = (eid('busca').value || '').toLowerCase().trim();
  const hoje = new Date().toISOString().slice(0, 10);

  // Escopo isola o grupo (não mistura com o resto da base) — resolve o
  // problema de "mostrar canceladas/finalizadas" antes revelar registros
  // junto com todo o restante da lista de forma confusa.
  let rows;
  if (ESCOPO === 'canceladas')      rows = RESCISOES.filter(r => r.cancelada);
  else if (ESCOPO === 'finalizadas') rows = RESCISOES.filter(r => r.status === 'finalizada');
  else if (ESCOPO === 'todas')       rows = RESCISOES.slice();
  else /* 'ativas' */                rows = RESCISOES.filter(r => !r.cancelada && r.status !== 'finalizada');

  if (F_STATUS !== 'todas') rows = rows.filter(r => r.status === F_STATUS);
  if ((PERFIL === 'admin' || PERFIL === 'gestor') && F_ANALISTA !== 'todos') {
    rows = rows.filter(r => r.analista_id === F_ANALISTA);
  }
  if (F_PRAZO5D) {
    const limite = new Date();
    limite.setDate(limite.getDate() + 5);
    const limiteStr = limite.toISOString().slice(0, 10);
    rows = rows.filter(r =>
      !r.cancelada && r.status !== 'finalizada' &&
      r.prazo_pagamento && r.prazo_pagamento >= hoje && r.prazo_pagamento <= limiteStr
    );
  }
  if (busca) {
    rows = rows.filter(r =>
      (r.funcionario_nome || '').toLowerCase().includes(busca) ||
      (r.empresas?.razao_social || '').toLowerCase().includes(busca) ||
      String(r.empresas?.codigo || '').includes(busca)
    );
  }

  if (!rows.length) {
    eid('lista').innerHTML = `<div class="empty"><h3>Nenhuma rescisão encontrada</h3>
      <p>Ajuste os filtros ou cadastre uma nova rescisão.</p></div>`;
    return;
  }

  eid('lista').innerHTML = rows.map(r => {
    const atrasada = !r.cancelada && r.status !== 'finalizada' && r.prazo_pagamento < hoje;
    return `
      <div class="rs-card ${atrasada ? 'atrasada' : ''} ${r.cancelada ? 'cancelada' : ''}" onclick="openDetalhe('${r.id}')">
        <div class="rs-main">
          <div class="rs-nome">${escHtml(r.funcionario_nome)}</div>
          <div class="rs-sub">${escHtml(r.empresas?.codigo ?? '—')} · ${escHtml(r.empresas?.razao_social ?? 'Empresa não encontrada')} · ${TIPO_RESCISAO_LABEL[r.tipo_rescisao] || r.tipo_rescisao}</div>
        </div>
        <div class="rs-meta">
          <div class="rs-meta-item">Responsável<br><b>${escHtml(r.usuarios?.nome ?? '—')}</b></div>
          <div class="rs-meta-item">Prazo<br><b class="${atrasada ? 'rs-prazo atrasada' : ''}">${fmtDate(r.prazo_pagamento)}</b></div>
          ${r.cancelada ? `<span class="badge badge-cancelada">Cancelada</span>` : ''}
          <span class="badge st-${r.status}">${STATUS_LABEL[r.status] || r.status}</span>
        </div>
      </div>`;
  }).join('');
}

async function buscarEmpresa(codigo) {
  const cod = parseInt(codigo, 10);
  if (isNaN(cod)) {
    eid('cad-empresa-status').innerHTML = `<div class="emp-err">Código deve ser numérico.</div>`;
    return;
  }
  const { data, error } = await sb
    .from('empresas').select('id, codigo, razao_social')
    .eq('codigo', cod).maybeSingle();

  if (error || !data) {
    // RLS filtra empresas fora da carteira do analista — do ponto de
    // vista da UI, "não encontrada" cobre os dois casos (não existe
    // ou está fora da carteira). A RPC abrir_rescisao dá a mensagem
    // específica se, ainda assim, a submissão for tentada.
    eid('cad-empresa-status').innerHTML = `<div class="emp-err">Empresa não encontrada ou fora da sua carteira.</div>`;
    return;
  }
  CAD_EMPRESA = data;
  eid('cad-empresa-status').innerHTML = `<div class="emp-found">✓ ${escHtml(data.razao_social)}</div>`;
}

async function submitCadastro() {
  if (!CAD_EMPRESA) return toast('Localize uma empresa válida antes de continuar.', 'err');

  const nome = eid('cad-nome').value.trim().toUpperCase();
  if (!nome) return toast('Informe o nome do funcionário.', 'err');

  const dataRescisao = eid('cad-data-rescisao').value;
  if (!dataRescisao) return toast('Informe a data da rescisão.', 'err');

  const analistaId = PERFIL === 'analista' ? ME.id : eid('cad-analista').value;
  if (!analistaId) return toast('Selecione o responsável.', 'err');

  const btn = eid('cad-btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando…';

  const { error } = await sb.rpc('abrir_rescisao', {
    p_empresa_id: CAD_EMPRESA.id,
    p_analista_id: analistaId,
    p_funcionario_nome: nome,
    p_tipo_rescisao: eid('cad-tipo-rescisao').value,
    p_tipo_aviso: eid('cad-tipo-aviso').value,
    p_data_rescisao: dataRescisao,
    p_data_solicitacao: eid('cad-data-solicitacao').value || null,
    p_data_recebimento_apontamentos: eid('cad-data-recebimento').value || null,
    p_observacoes: eid('cad-obs').value.trim().toUpperCase() || null
  });

  btn.disabled = false; btn.textContent = 'Abrir rescisão';

  if (error) return toast('Erro ao abrir rescisão: ' + error.message, 'err');

  toast('Rescisão cadastrada com sucesso.', 'ok');
  closeCadastro();
  await loadRescisoes();
}

// ============================================================
// DETALHE — visualizar, editar, checklist, pipeline, histórico
// ============================================================
async function openDetalhe(id) {
  DET_RESCISAO_ID = id;
  eid('det-body').innerHTML = `<div class="loading"><div class="spinner"></div> Carregando…</div>`;
  eid('modal-det').classList.add('show');
  await renderDetalhe();
}
function closeDetalhe() { eid('modal-det').classList.remove('show'); DET_RESCISAO_ID = null; }

async function renderDetalhe() {
  const id = DET_RESCISAO_ID;
  const [{ data: r, error: e1 }, { data: tarefas, error: e2 }, { data: hist, error: e3 }] = await Promise.all([
    sb.from('rs_rescisoes').select(`
      id, funcionario_nome, tipo_rescisao, tipo_aviso, status, observacoes,
      data_solicitacao, data_recebimento_apontamentos, data_rescisao, prazo_pagamento,
      analista_id, cancelada, motivo_cancelamento, cancelada_em,
      empresas!rs_rescisoes_empresa_id_fkey ( codigo, razao_social ),
      responsavel:usuarios!rs_rescisoes_analista_id_fkey ( nome ),
      cancelador:usuarios!rs_rescisoes_cancelada_por_fkey ( nome )
    `).eq('id', id).single(),
    sb.from('rs_tarefas').select('id, tipo_tarefa, ordem, concluida, concluida_em, observacao, usuarios(nome)')
      .eq('rescisao_id', id).order('ordem'),
    sb.from('rs_historico').select('status_anterior, status_novo, observacao, created_at, usuarios(nome)')
      .eq('rescisao_id', id).order('created_at', { ascending: false })
  ]);

  if (e1 || !r) { eid('det-body').innerHTML = `<p>Erro ao carregar rescisão.</p>`; return; }

  const podeAgir = PERFIL !== 'analista' || r.analista_id === ME.id;
  const podeExcluir = PERFIL === 'admin';
  const outrosStatus = STATUS_ORDER.filter(s => s !== r.status);

  eid('det-body').innerHTML = `
    <h3>${escHtml(r.funcionario_nome)}</h3>
    <p class="sub">${escHtml(r.empresas?.codigo ?? '—')} · ${escHtml(r.empresas?.razao_social ?? '—')} · Responsável: ${escHtml(r.responsavel?.nome ?? '—')}</p>

    ${r.cancelada ? `
      <div class="cancel-banner">
        <b>Rescisão cancelada</b>
        Em ${fmtDateTime(r.cancelada_em)} por ${escHtml(r.cancelador?.nome ?? '—')}.<br>
        Motivo: ${escHtml(r.motivo_cancelamento)}
        ${podeAgir ? `<div style="margin-top:8px"><button class="btn btn-xs btn-secondary" onclick="reabrirRescisao()">Reabrir rescisão</button></div>` : ''}
      </div>
    ` : `
      <div class="status-changer">
        <span class="badge st-${r.status}">${STATUS_LABEL[r.status]}</span>
        ${podeAgir ? `
          <select id="det-novo-status">
            ${outrosStatus.map(s => `<option value="${s}">${STATUS_LABEL[s]}</option>`).join('')}
          </select>
          <button class="btn btn-xs btn-primary" onclick="mudarStatus()">Mudar status</button>
        ` : ''}
      </div>
      ${podeAgir ? `<textarea id="det-status-obs" placeholder="Observação da mudança de status (opcional)" style="margin-bottom:14px" oninput="toUpper(this)"></textarea>` : ''}
    `}

    <div class="det-section">
      <h4>Dados cadastrais</h4>
      <div class="frow2">
        <div class="field"><label>Tipo de rescisão</label>
          <select id="det-tipo-rescisao">${Object.entries(TIPO_RESCISAO_LABEL)
            .map(([v, l]) => `<option value="${v}" ${v === r.tipo_rescisao ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label>Aviso prévio</label>
          <select id="det-tipo-aviso">${Object.entries(TIPO_AVISO_LABEL)
            .map(([v, l]) => `<option value="${v}" ${v === r.tipo_aviso ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="frow2">
        <div class="field"><label>Data da rescisão</label>
          <input type="date" id="det-data-rescisao" value="${r.data_rescisao || ''}"></div>
        <div class="field"><label>Prazo de pagamento</label>
          <input type="date" id="det-prazo" value="${r.prazo_pagamento || ''}"></div>
      </div>
      <div class="frow2">
        <div class="field"><label>Data da solicitação</label>
          <input type="date" id="det-data-solicitacao" value="${r.data_solicitacao || ''}"></div>
        <div class="field"><label>Recebimento dos apontamentos</label>
          <input type="date" id="det-data-recebimento" value="${r.data_recebimento_apontamentos || ''}"></div>
      </div>
      <div class="field"><label>Observações</label>
        <textarea id="det-obs" oninput="toUpper(this)">${escHtml(r.observacoes || '')}</textarea></div>
      <button class="btn btn-xs btn-secondary" onclick="salvarEdicao()">Salvar alterações</button>
    </div>

    <div class="det-section">
      <h4>Checklist</h4>
      ${(tarefas || []).map(t => `
        <div class="check-item">
          <input type="checkbox" ${t.concluida ? 'checked' : ''}
                 onchange="toggleTarefa('${t.id}', this.checked)">
          <div class="check-body">
            <div class="check-label ${t.concluida ? 'done' : ''}">${TIPO_TAREFA_LABEL[t.tipo_tarefa] || t.tipo_tarefa}</div>
            ${t.concluida ? `<div class="check-meta">Concluída por ${escHtml(t.usuarios?.nome ?? '—')} em ${fmtDateTime(t.concluida_em)}</div>` : ''}
          </div>
        </div>
      `).join('') || '<p class="hint">Nenhuma tarefa gerada.</p>'}
    </div>

    <div class="det-section">
      <h4>Histórico</h4>
      ${(hist || []).map(h => `
        <div class="timeline-item">
          <div class="tl-status">${h.status_anterior ? STATUS_LABEL[h.status_anterior] + ' → ' : ''}${STATUS_LABEL[h.status_novo]}</div>
          <div class="tl-meta">${escHtml(h.usuarios?.nome ?? '—')} · ${fmtDateTime(h.created_at)}</div>
          ${h.observacao ? `<div class="tl-obs">${escHtml(h.observacao)}</div>` : ''}
        </div>
      `).join('') || '<p class="hint">Sem movimentações.</p>'}
    </div>

    ${(podeAgir && !r.cancelada) || podeExcluir ? `
      <div class="danger-zone">
        <h4 style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--gray-400);margin-bottom:10px">Zona de risco</h4>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${(podeAgir && !r.cancelada) ? `<button class="btn btn-xs btn-danger" onclick="cancelarRescisao()">Cancelar rescisão</button>` : ''}
          ${podeExcluir ? `<button class="btn btn-xs btn-danger" onclick="excluirRescisao()">Excluir definitivamente</button>` : ''}
        </div>
      </div>
    ` : ''}
  `;
}

async function salvarEdicao() {
  const id = DET_RESCISAO_ID;
  const payload = {
    tipo_rescisao: eid('det-tipo-rescisao').value,
    tipo_aviso: eid('det-tipo-aviso').value,
    data_rescisao: eid('det-data-rescisao').value || null,
    prazo_pagamento: eid('det-prazo').value || null,
    data_solicitacao: eid('det-data-solicitacao').value || null,
    data_recebimento_apontamentos: eid('det-data-recebimento').value || null,
    observacoes: eid('det-obs').value.trim().toUpperCase() || null
  };
  const { error } = await sb.from('rs_rescisoes').update(payload).eq('id', id);
  if (error) return toast('Erro ao salvar: ' + error.message, 'err');
  toast('Dados atualizados.', 'ok');
  await loadRescisoes();
}

async function toggleTarefa(tarefaId, concluida) {
  const { error } = await sb.rpc('concluir_tarefa_rescisao', {
    p_tarefa_id: tarefaId, p_concluida: concluida
  });
  if (error) { toast('Erro ao atualizar tarefa: ' + error.message, 'err'); await renderDetalhe(); return; }
  await renderDetalhe();
}

async function mudarStatus() {
  const novoStatus = eid('det-novo-status')?.value;
  if (!novoStatus) return toast('Selecione o status de destino.', 'err');
  const obs = eid('det-status-obs')?.value.trim().toUpperCase() || null;

  const { error } = await sb.rpc('atualizar_status_rescisao', {
    p_rescisao_id: DET_RESCISAO_ID, p_status_novo: novoStatus, p_observacao: obs
  });
  if (error) return toast('Erro ao mudar status: ' + error.message, 'err');
  toast('Status atualizado.', 'ok');
  await renderDetalhe();
  await loadRescisoes();
}

async function cancelarRescisao() {
  const motivo = prompt('Motivo do cancelamento (obrigatório):');
  if (motivo === null) return; // usuário cancelou o prompt
  if (!motivo.trim()) return toast('Informe o motivo do cancelamento.', 'err');

  const { error } = await sb.rpc('cancelar_rescisao', {
    p_rescisao_id: DET_RESCISAO_ID, p_motivo: motivo.trim().toUpperCase()
  });
  if (error) return toast('Erro ao cancelar: ' + error.message, 'err');
  toast('Rescisão cancelada.', 'ok');
  await renderDetalhe();
  await loadRescisoes();
}

async function reabrirRescisao() {
  if (!confirm('Reabrir esta rescisão? Ela volta a ficar ativa no status em que estava.')) return;

  const { error } = await sb.rpc('reabrir_rescisao', { p_rescisao_id: DET_RESCISAO_ID });
  if (error) return toast('Erro ao reabrir: ' + error.message, 'err');
  toast('Rescisão reaberta.', 'ok');
  await renderDetalhe();
  await loadRescisoes();
}

async function excluirRescisao() {
  if (!confirm('Excluir esta rescisão PERMANENTEMENTE? Isso remove o cadastro, o checklist e o histórico. Não é possível desfazer.')) return;
  if (!confirm('Tem certeza mesmo? Essa ação não pode ser revertida.')) return;

  const { error } = await sb.from('rs_rescisoes').delete().eq('id', DET_RESCISAO_ID);
  if (error) return toast('Erro ao excluir: ' + error.message, 'err');
  toast('Rescisão excluída.', 'ok');
  closeDetalhe();
  await loadRescisoes();
}

// ============================================================
// AUTH / HELPERS
// ============================================================
async function doLogout() { await sb.auth.signOut(); }

function eid(id) { return document.getElementById(id) }
function show(id) { const el = eid(id); el.classList.remove('hidden'); el.style.removeProperty('display') }
function hide(id) { const el = eid(id); el.classList.add('hidden'); el.style.display = 'none' }

// Converte o valor do campo para maiúsculas em tempo real, preservando a
// posição do cursor (sem isso, o cursor pularia para o fim do texto a
// cada tecla digitada, atrapalhando edição no meio da frase). Aplicado
// nos campos de texto livre (nome do funcionário, observações, motivo
// de cancelamento) por padrão de digitação — não altera código de
// empresa nem outros campos numéricos/estruturados.
function toUpper(el) {
  const start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.toUpperCase();
  if (start !== null && end !== null) el.setSelectionRange(start, end);
}

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}
function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) { return String(s ?? '').replace(/"/g,'&quot;').replace(/'/g,'&#39;') }

let _toastT;
function toast(msg, type = 'inf') {
  const el = eid('toast');
  el.textContent = msg; el.className = type; show('toast');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => hide('toast'), 3500);
}

// Fecha modais ao clicar fora
eid('modal-cad').addEventListener('click', e => { if (e.target === eid('modal-cad')) closeCadastro(); });
eid('modal-det').addEventListener('click', e => { if (e.target === eid('modal-det')) closeDetalhe(); });
</script>
